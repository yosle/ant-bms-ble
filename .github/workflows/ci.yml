name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e .
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke (no hardware)
        run: |
          antbms --version
          antbms demo --json --frames 2 --interval 0
          antbms decode 7ea1010000be1855aa55
