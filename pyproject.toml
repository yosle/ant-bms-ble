[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ant-bms-ble"
version = "0.1.0"
description = "Read-only BLE client, live TUI dashboard and complete protocol spec for ANT BMS (the 7E A1 protocol), reverse-engineered from the official app and verified on real hardware"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ant-bms-ble contributors" }]
keywords = [
    "ant-bms",
    "bms",
    "ble",
    "bluetooth-low-energy",
    "battery",
    "lifepo4",
    "bleak",
    "protocol",
    "reverse-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "bleak>=0.22",
    "rich>=13",
]

[project.scripts]
antbms = "antbms.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
antbms = ["params_full.json"]
